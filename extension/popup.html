<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .orb { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0ea5e9, #5eead4); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .title { font-size: 15px; font-weight: 700; color: #5eead4; }
    .version { font-size: 10px; color: #475569; margin-left: auto; }
    .status { padding: 10px; background: rgba(30,41,59,0.6); border-radius: 8px; margin-bottom: 12px; font-size: 12px; }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { color: #94a3b8; }
    .status-value { color: #e2e8f0; font-weight: 600; }
    .hotkeys { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(148,163,184,0.1); }
    .hotkey { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: #94a3b8; }
    .hotkey-kbd { background: rgba(30,41,59,0.8); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(148,163,184,0.2); color: #5eead4; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <div class="orb">🧭</div>
    <div class="title">Scout Sentinel</div>
    <div class="version">v2.0</div>
  </div>
  <div class="status">
    <div class="status-row">
      <span class="status-label">Server</span>
      <span class="status-value" id="srv-status">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">AI Backend</span>
      <span class="status-value" id="ai-status">Checking...</span>
    </div>
  </div>
  <div class="hotkeys">
    <div class="hotkey"><span>Open HUD</span> <span class="hotkey-kbd">Alt+Shift+C</span></div>
    <div class="hotkey"><span>Select Lens</span> <span class="hotkey-kbd">Alt+Drag</span></div>
    <div class="hotkey"><span>Close HUD</span> <span class="hotkey-kbd">Esc</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
