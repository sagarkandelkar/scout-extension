<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(94,234,212,0.15);
    }
    .logo { font-size: 22px; }
    .title { font-size: 16px; font-weight: 700; color: #5eead4; }
    .subtitle { font-size: 11px; color: #64748b; margin-left: auto; text-align: right; }

    .conn-box {
      background: rgba(30,41,59,0.8);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .conn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .conn-row:last-child { margin-bottom: 0; }
    .conn-label { color: #94a3b8; }
    .conn-value { color: #e2e8f0; font-weight: 600; }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px;
    }
    .conn-ok { background: #10b981; }
    .conn-err { background: #ef4444; }
    .conn-warn { background: #f59e0b; }

    .test-btn {
      width: 100%;
      padding: 10px;
      background: rgba(94,234,212,0.12);
      border: 1px solid rgba(94,234,212,0.3);
      border-radius: 8px;
      color: #5eead4;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .test-btn:hover { background: rgba(94,234,212,0.2); }
    .test-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .log-box {
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 6px;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #94a3b8;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .log-box div { margin-bottom: 3px; }
    .log-ok { color: #10b981; }
    .log-err { color: #f43f5e; }
    .log-info { color: #5eead4; }

    .modes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .mode-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(30,41,59,0.6);
      border: 1px solid rgba(94,234,212,0.1);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .mode-btn:hover {
      background: rgba(94,234,212,0.08);
      border-color: rgba(94,234,212,0.3);
    }
    .mode-btn.active {
      background: rgba(94,234,212,0.1);
      border-color: #5eead4;
      color: #5eead4;
    }
    .mode-icon { font-size: 16px; width: 24px; text-align: center; }

    .footer {
      display: flex;
      gap: 6px;
    }
    .foot-btn {
      flex: 1;
      padding: 8px;
      background: rgba(94,234,212,0.08);
      border: 1px solid rgba(94,234,212,0.2);
      border-radius: 6px;
      color: #5eead4;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🧭</span>
    <div>
      <div class="title">Scout</div>
    </div>
    <div class="subtitle">v1.0.0<br>Diagnostics</div>
  </div>

  <div class="conn-box">
    <div class="conn-row">
      <span class="conn-label">Server (localhost:8765)</span>
      <span class="conn-value" id="srv-status"><span class="conn-dot conn-warn" id="srv-dot"></span>Checking...</span>
    </div>
    <div class="conn-row">
      <span class="conn-label">AI Backend (Ollama)</span>
      <span class="conn-value" id="ai-status"><span class="conn-dot conn-warn" id="ai-dot"></span>Checking...</span>
    </div>
    <div class="conn-row">
      <span class="conn-label">Model</span>
      <span class="conn-value" id="model-status">—</span>
    </div>
  </div>

  <button class="test-btn" id="btn-test">🧪 Test Connection &amp; Analyze This Page</button>

  <div class="log-box" id="log-box">
    <div class="log-info">Open popup to run diagnostics...</div>
  </div>

  <div class="modes">
    <button class="mode-btn active" data-mode="auto">
      <span class="mode-icon">🎯</span>
      <span>Auto-Detect</span>
    </button>
    <button class="mode-btn" data-mode="job">
      <span class="mode-icon">💼</span>
      <span>Job Portal Mode</span>
    </button>
    <button class="mode-btn" data-mode="social">
      <span class="mode-icon">💬</span>
      <span>Social Media Mode</span>
    </button>
    <button class="mode-btn" data-mode="shopping">
      <span class="mode-icon">🛒</span>
      <span>Shopping Mode</span>
    </button>
    <button class="mode-btn" data-mode="news">
      <span class="mode-icon">📰</span>
      <span>News Mode</span>
    </button>
    <button class="mode-btn" data-mode="chat">
      <span class="mode-icon">🗨️</span>
      <span>Chat / Conversation Mode</span>
    </button>
  </div>

  <div class="footer">
    <button class="foot-btn" id="btn-clear">Clear Data</button>
    <button class="foot-btn" id="btn-reload">Reload Ext</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
