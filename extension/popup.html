<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(94,234,212,0.15);
    }
    .logo { font-size: 22px; }
    .title { font-size: 16px; font-weight: 700; color: #5eead4; }
    .subtitle { font-size: 11px; color: #64748b; margin-left: auto; text-align: right; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: rgba(30,41,59,0.8);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 700; color: #5eead4; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

    .modes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .mode-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(30,41,59,0.6);
      border: 1px solid rgba(94,234,212,0.1);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .mode-btn:hover {
      background: rgba(94,234,212,0.08);
      border-color: rgba(94,234,212,0.3);
    }
    .mode-btn.active {
      background: rgba(94,234,212,0.1);
      border-color: #5eead4;
      color: #5eead4;
    }
    .mode-icon { font-size: 16px; width: 24px; text-align: center; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(15,23,42,0.8);
      border-radius: 6px;
      font-size: 11px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #10b981;
    }
    .status-dot.offline { background: #ef4444; }

    .quick-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .quick-btn {
      flex: 1;
      padding: 8px;
      background: rgba(94,234,212,0.08);
      border: 1px solid rgba(94,234,212,0.2);
      border-radius: 6px;
      color: #5eead4;
      font-size: 11px;
      cursor: pointer;
    }
    .quick-btn:hover { background: rgba(94,234,212,0.15); }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🧭</span>
    <div>
      <div class="title">Scout</div>
    </div>
    <div class="subtitle">v1.0.0<br>Local AI</div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-alerts">0</div>
      <div class="stat-label">Alerts Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-sites">0</div>
      <div class="stat-label">Sites Analyzed</div>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn active" data-mode="auto">
      <span class="mode-icon">🎯</span>
      <span>Auto-Detect</span>
    </button>
    <button class="mode-btn" data-mode="job">
      <span class="mode-icon">💼</span>
      <span>Job Portal Mode</span>
    </button>
    <button class="mode-btn" data-mode="social">
      <span class="mode-icon">💬</span>
      <span>Social Media Mode</span>
    </button>
    <button class="mode-btn" data-mode="shopping">
      <span class="mode-icon">🛒</span>
      <span>Shopping Mode</span>
    </button>
    <button class="mode-btn" data-mode="news">
      <span class="mode-icon">📰</span>
      <span>News Mode</span>
    </button>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Bridge Connected</span>
    </div>
    <span id="model-name">llama3.2</span>
  </div>

  <div class="quick-actions">
    <button class="quick-btn" id="btn-clear">Clear Data</button>
    <button class="quick-btn" id="btn-settings">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
